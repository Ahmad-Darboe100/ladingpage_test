<!DOCTYPE html>
<HTML Lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Document</title>
        <meta name="Git" content="Learning about Git">
        <meta http-equiv="X-UA-Compatable" content="IE=edge">
    </head>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .navbar{
            background-color: lightskyblue;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .Logo h1{
            color: #fff;
            padding: 2px 2px 2px 30px;
        }
        .Logo h1 span{
            color: black;
        }
        .nav-items{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .nav-links{
            list-style: none;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px;
        }
        .nav-links li a{
            text-decoration: none;
            padding: 10px;
            color: #fff;
        }
        .nav-items li a:hover{
            background-color: grey;
            border-radius: 5px;
        }
    </style>
    <body>
        <!-- <h1>Hello World</h1> -->

        <nav class="navbar">
            <div class="Logo">
                <h1><span>MGQS</span> Institute</h1>
            </div>
            <div class="nav-items">
                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </div>
        </nav>
    </body>
</HTML>
